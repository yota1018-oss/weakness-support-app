<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weakness Support App</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f7f5ff;font-family:Inter,"Hiragino Sans",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#09090e;padding:18px 13px 78px}.date{color:#858197;font-size:11px}h1{font-size:22px;margin:3px 0 9px}.status{display:flex;justify-content:space-between;color:#8f8a9e;font-size:11px;padding-bottom:12px;border-bottom:1px solid #292735}.line{height:4px;background:#252331;border-radius:9px;margin-top:8px}.line i{display:block;height:100%;width:0;background:#8c3ffc;border-radius:9px}.card{background:#121119;border:1px solid #2b2936;border-radius:10px;padding:13px;margin:10px 0;display:grid;grid-template-columns:20px 1fr;gap:10px}.dot{width:19px;height:19px;border:1px solid #454156;border-radius:50%;background:#201e2b}.dot.on{background:#8538f5;border-color:#8538f5}.tag{font-size:10px;color:#934bff;margin:1px 0 3px}.title{font-size:12px;font-weight:700;line-height:1.4}.meta{font-size:10px;color:#898599;margin:8px 0}.buttons{display:flex;gap:7px}.buttons button{flex:1;border:0;border-radius:5px;padding:7px;background:#292738;color:#89869a;font-size:10px}.buttons .yes{background:linear-gradient(90deg,#933fff,#6927dc);color:white}.view{display:none}.view.active{display:block}.empty{height:20px}.chatHead{display:flex;align-items:center;gap:9px;margin:14px 0}.bot{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#251b38}.bubble{max-width:88%;padding:12px;border:1px solid #2c2939;background:#16141e;border-radius:10px;font-size:12px;line-height:1.6}.hint{margin:14px 0;color:#a49eb3;font-size:11px}.chatbox{position:fixed;bottom:65px;width:min(404px,calc(100% - 26px));display:flex;border:1px solid #363144;border-radius:9px;background:#15131e;padding:7px}.chatbox input{flex:1;background:transparent;border:0;color:white;outline:0;font-size:12px}.chatbox button{border:0;background:#8538f5;color:white;border-radius:5px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:flex;justify-content:space-around;background:#0b0a10;border-top:1px solid #24222e;padding:8px 8px 11px}.tabs button{background:transparent;border:0;color:#777287;font-size:10px;display:grid;gap:3px}.tabs button b{font-size:16px}.tabs button.active{color:#954cff}.period{display:flex;background:#1e1b2a;border-radius:7px;padding:3px;margin:12px 0}.period button{border:0;flex:1;background:transparent;color:#aaa5b8;padding:7px;font-size:11px}.period .active{background:#873af4;color:white;border-radius:5px}.chart{height:145px;border:1px solid #2b2936;border-radius:10px;padding:12px;font-size:12px}.chart h3{font-size:12px;margin:0}.bars{height:88px;display:flex;align-items:end;justify-content:space-around}.bar{width:22px;background:#2c293d}.bar:last-child{background:#ff5c73}.compare{border:1px solid #2b2936;border-radius:10px;padding:13px;margin-top:11px;font-size:12px}.compare strong{float:right;color:#9c59ff}.grouphead{display:flex;justify-content:space-between;align-items:center}.invite{background:#873af4;color:white;border:0;border-radius:5px;padding:7px;font-size:11px}.filters button{background:#262334;color:#b9b2ca;border:0;padding:7px 10px;font-size:11px}.filters button:first-child{background:#873af4;color:white;border-radius:5px}.rank{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #252330;font-size:12px}.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#35314d}.rank small{color:#8c8799}.score{margin-left:auto;color:#b9b2c9}.privacy{margin-top:15px;border:1px solid #2b2936;border-radius:10px;padding:12px;color:#aaa5b6;font-size:11px;line-height:1.5}.done{opacity:.62}
</style><body><main class="app"><section id="today" class="view active"><div class="date" id="date"></div><h1>今日のアクション</h1><div class="status"><span>🔥 <b id="streak">0</b> 日</span><span><b id="count">0</b> / 3 完了</span></div><div class="line"><i id="line"></i></div><div id="actions"></div></section><section id="chat" class="view"><div class="chatHead"><div class="bot">🤖</div><div><b>AIと相談する</b><br><small style="color:#8f48ff">● オンライン</small></div></div><div class="bubble">こんにちは。今日はどんなことを話したいですか？最近、自分について気になっていることや、うまくいかないと感じていることがあれば、気軽に教えてください。</div><p class="hint">💡 今日うまくいかなかったことや、気になっていることを話してみてください。</p><div id="messages"></div><form class="chatbox" onsubmit="send(event)"><input id="input" placeholder="メッセージを入力…"><button>送信</button></form></section><section id="review" class="view"><h1>振り返り</h1><span class="date">3週間前との変化を見てみましょう</span><div class="period"><button class="active">週次</button><button>月次</button></div><div class="chart"><h3>アクション実行率の推移</h3><div class="bars"><i class="bar" style="height:30%"></i><i class="bar" style="height:48%"></i><i class="bar" style="height:67%"></i><i class="bar" style="height:82%"></i></div></div><div class="chart" style="margin-top:11px"><h3>夜のSNS閲覧時間（分）</h3><div class="bars"><i class="bar" style="height:80%"></i><i class="bar" style="height:63%"></i><i class="bar" style="height:50%"></i><i class="bar" style="height:87%"></i></div></div><div class="compare">3週間前 → 今の変化 <strong>平均 90分　→　平均 38分</strong></div></section><section id="group" class="view"><div class="grouphead"><div><h1>みんなの進捗</h1><span class="date">TMCグループ · 5人</span></div><button class="invite">＋ 招待</button></div><p class="filters"><button>🔥 継続日数</button><button>✅ 実行率</button></p><div id="ranks"></div><div class="privacy">🔒 <b>プライバシー設定</b><br>進捗（実行率・継続日数）のみ共有中。弱点の内容は非公開。</div></section></main><nav class="tabs"><button class="active" onclick="show('today',this)"><b>⚡</b>今日</button><button onclick="show('chat',this)"><b>💬</b>相談</button><button onclick="show('review',this)"><b>📈</b>振り返り</button><button onclick="show('group',this)"><b>👥</b>みんな</button></nav><script>
const acts=[['夜のSNS過多','21時以降はスマホをベッドから離す','毎日 ・ 夜'],['夜のSNS過多','SNS閲覧を1日30分に制限するアプリを設定する','毎日 ・ 朝'],['先延ばし癖','タスク着手前に「机に3分座る」だけを目標にする','週5回 ・ 午前']];let done=JSON.parse(localStorage.getItem('wsa')||'[]');function render(){actions.innerHTML=acts.map((a,i)=>`<article class="card ${done.includes(i)?'done':''}"><i class="dot ${done.includes(i)?'on':''}"></i><div><p class="tag">${a[0]}</p><div class="title">${a[1]}</div><p class="meta">${a[2]}</p><div class="buttons"><button class="yes" onclick="mark(${i},true)">実行した ✓</button><button onclick="mark(${i},false)">できなかった</button></div></div></article>`).join('');count.textContent=done.length;streak.textContent=done.length;line.style.width=(done.length/3*100)+'%'}function mark(i,yes){done=yes?[...new Set([...done,i])]:done.filter(x=>x!==i);localStorage.setItem('wsa',JSON.stringify(done));render()}function show(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function send(e){e.preventDefault();if(!input.value)return;messages.innerHTML+=`<p class="bubble" style="margin-left:auto;background:#7832e7">${input.value}</p>`;input.value=''}date.textContent=new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});ranks.innerHTML=[['🟡','山田 陽斗','21日','95%'],['🔵','田中 蓮','18日','91%'],['🟣','あなた','12日','83%'],['🟢','佐藤 葵','7日','71%'],['🟠','鈴木 ひな','5日','60%']].map((x,i)=>`<div class="rank"><b>${i+1}</b><span class="avatar">${x[0]}</span><span><b>${x[1]}</b><br><small>🔥 ${x[2]}　✅ ${x[3]}</small></span><span class="score">${x[2]}</span></div>`).join('');render();
</script></body></html>
